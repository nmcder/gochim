name: Release

# 태그를 밀면 확장 zip을 만들어 릴리스에 붙인다.
# 크롬 웹 스토어 등록은 아직 못 하므로(만 18세는 개발자 약관상 미성년자),
# 받는 사람은 zip을 풀어 '압축해제된 확장 프로그램을 로드'로 설치한다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 릴리스에 깨진 물건을 올리지 않도록 전부 통과시킨 뒤에 만든다.
      # guard까지 넣는 이유: `npm test`는 골든셋 안에서만 보고, 밖에서 온 한국어에
      # 처음 보는 오탐이 생겼는지는 guard만 안다. 그건 받는 사람 글이 망가진다는 뜻이다.
      - name: 검증
        run: |
          npm run typecheck
          npm test
          npm run guard

      - name: 확장 zip 만들기
        run: npm run pack:extension

      - name: 골든 테스트셋 성적표
        run: node scripts/golden-report.mjs | tee golden-report.txt

      # 릴리스 본문에 CHANGELOG를 통째로 넣으면 44 kB가 그대로 올라간다.
      # 이 판의 절만 잘라 낸다 — 두 번째 '## '를 만나면 멈춘다.
      - name: 이 판의 변경 기록만 잘라내기
        run: awk '/^## /{n++} n==1' CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/release/*.zip
            golden-report.txt
          body_path: release-notes.md
          draft: true
          generate_release_notes: false
