name: Release

# 태그를 밀면 확장 zip을 만들어 릴리스에 붙인다.
# 크롬 웹 스토어 등록은 아직 못 하므로(만 18세는 개발자 약관상 미성년자),
# 받는 사람은 zip을 풀어 '압축해제된 확장 프로그램을 로드'로 설치한다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 릴리스에 깨진 물건을 올리지 않도록 전부 통과시킨 뒤에 만든다.
      - name: 검증
        run: |
          npm run typecheck
          npm test

      - name: 확장 zip 만들기
        run: npm run pack:extension

      - name: 골든 테스트셋 성적표
        run: node scripts/golden-report.mjs | tee golden-report.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/release/*.zip
            golden-report.txt
          body_path: CHANGELOG.md
          draft: true
          generate_release_notes: false
