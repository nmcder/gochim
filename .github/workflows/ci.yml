name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # garu-ko는 0.9.14로 고정되어 있다. lockfile을 벗어난 설치는 막는다. (ADR 0001)
      - run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 테스트 (규칙 예시 · 오탐 · 골든 테스트셋 정밀도)
        run: npm test

      - name: 코어 빌드
        run: npm run build

      # 여기가 정확도의 관문이다. `npm test`는 골든셋 안에서만 보고,
      # 아래 성적표는 어겨도 종료 코드를 내지 않는다 — guard만 실패한다.
      #
      # 특히 **밖에서 온 한국어**(data/golden/wild.json 과 저장소 자기 산문)를 함께 재고,
      # data/golden/known-false-positives.json 에 없는 오탐이 하나라도 나오면 여기서 멈춘다.
      # 골든셋의 '정상 문장'은 규칙을 다듬는 데 쓴 문장이라 그것만으로는 정밀도를 못 잰다.
      - name: 지켜야 할 선 (정밀도·재현율 관문)
        run: npm run guard

      - name: 데모 빌드
        run: npm run build -w @gochim/demo

      - name: 확장 빌드
        run: npm run build -w @gochim/extension

      - name: 골든 테스트셋 성적표
        run: node scripts/golden-report.mjs
