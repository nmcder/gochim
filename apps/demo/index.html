<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>고침 — 브라우저 안에서만 도는 한국어 교정기</title>
    <meta
      name="description"
      content="맞춤법·띄어쓰기를 브라우저 안에서 검사합니다. 서버로 아무것도 보내지 않습니다."
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="masthead__title">
        <h1>고침</h1>
        <p class="masthead__sub">한국어 맞춤법·띄어쓰기 교정기</p>
      </div>
      <p class="masthead__claim">
        <span class="dot" aria-hidden="true"></span>
        입력한 글은 이 탭을 벗어나지 않습니다 — 네트워크 요청 <strong>0회</strong>
      </p>
    </header>

    <main class="layout">
      <section class="pane" aria-label="검사할 글">
        <div class="pane__head">
          <h2>검사할 글</h2>
          <dl class="stats">
            <div><dt>글자</dt><dd id="stat-chars">0</dd></div>
            <div><dt>오류</dt><dd id="stat-issues" aria-live="polite">0</dd></div>
            <div><dt>검사</dt><dd id="stat-time">0.0ms</dd></div>
          </dl>
        </div>

        <div class="stack">
          <div class="stack__highlights" id="highlights" aria-hidden="true"></div>
          <textarea
            id="input"
            class="stack__input"
            spellcheck="false"
            autocomplete="off"
            placeholder="여기에 글을 붙여넣어 보세요."
          ></textarea>
        </div>

        <div class="toolbar">
          <button type="button" id="fix-all" class="btn btn--primary">전부 고치기</button>
          <button type="button" id="load-sample" class="btn">예시 넣기</button>
          <button type="button" id="clear" class="btn btn--quiet">지우기</button>
        </div>

        <label class="morph" for="morph-toggle">
          <input type="checkbox" id="morph-toggle" />
          <span class="morph__label">형태소 분석 켜기</span>
          <span class="morph__note" id="morph-note">+1.6MB를 내려받아 품사까지 봅니다. 여전히 전부 기기 안에서.</span>
        </label>
      </section>

      <aside class="pane pane--findings" aria-label="검사 결과">
        <div class="pane__head">
          <h2>검사 결과</h2>
          <button type="button" id="reset-ignored" class="btn btn--quiet btn--sm" hidden>무시 되돌리기</button>
        </div>
        <ol class="findings" id="findings"></ol>
        <p class="empty" id="empty" aria-live="polite">글을 입력하면 결과가 여기에 나타납니다.</p>
      </aside>
    </main>

    <footer class="colophon">
      <p>
        규칙 <strong id="rule-count">0</strong>개 · 엔진 <code>@gochim/core</code> v<span id="version"></span> ·
        <a href="https://github.com/" rel="noreferrer">GitHub</a>
      </p>
      <p class="colophon__note">
        정밀도 우선 정책 — 확실하지 않으면 잡지 않습니다. 문맥이 필요한 오류는 형태소 분석 단계에서 다룹니다.
      </p>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
